name: Publish Sewer Release

on:
  push:
    branches:
      - main
    paths:
      - Sewer-Windows.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION.txt)"
          if [ -z "$VERSION" ]; then
            echo "VERSION.txt is empty"
            exit 1
          fi
          case "$VERSION" in
            v*) ;;
            *) VERSION="v$VERSION" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" Sewer-Windows.zip --clobber
          else
            gh release create "$VERSION" Sewer-Windows.zip \
              --target main \
              --title "Sewer $VERSION" \
              --notes "Scale/Div: integer values with 1 dB/div step."
          fi
